name: Publish npm packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: npm-publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile --cpu='*' --os='*'
      - run: bun run verify
      - run: bun run test:ci
      - run: bun run smoke:core
      - run: bun run smoke:packager
      - run: bun run build:npm-cli
      - run: bun run pack:npm-cli:dry-run
      - run: bun scripts/smoke-npm-cli.ts --skip-build
      - name: Publish packages
        run: |
          set -euo pipefail

          # Continue past individual failures so one new package's first-publish
          # bootstrap (OIDC 404 until trusted publisher is configured on npm)
          # does not strand already-known packages in the same cut.
          failed=()

          for package_dir in \
            packages/prism-sdk \
            packages/prism-packager \
            packages/npm/prism-darwin-arm64 \
            packages/npm/prism-darwin-x64 \
            packages/npm/prism-linux-arm64 \
            packages/npm/prism-linux-x64 \
            packages/npm/prism
          do
            package_name="$(node -p "require('./${package_dir}/package.json').name")"
            package_version="$(node -p "require('./${package_dir}/package.json').version")"

            if npm view "${package_name}@${package_version}" version --prefer-online >/dev/null 2>&1; then
              echo "Skipping ${package_name}@${package_version}; already published"
              continue
            fi

            echo "Publishing ${package_name}@${package_version} from ${package_dir}"
            if ! npm publish "./${package_dir}" --access public; then
              echo "::error::Failed to publish ${package_name}@${package_version}"
              if [[ "${package_name}" == "@skastr0/prism-packager" ]]; then
                echo "::notice::First publish of a new package name under OIDC often 404s until the package exists on npm with a trusted publisher for this repo (skastr0/prism). Create @skastr0/prism-packager + GitHub Actions trusted publisher on npmjs.com, then re-run this workflow."
              fi
              failed+=("${package_name}@${package_version}")
            fi
          done

          if ((${#failed[@]} > 0)); then
            echo "Publish failures: ${failed[*]}"
            exit 1
          fi
